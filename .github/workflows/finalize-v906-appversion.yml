name: Finalizar XUPER FENIX V9.0.6

on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-v906-appversion.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: 25829b675a63b9e1ae90e90ca6a69f77
      EXPECTED_SHA: 038c9d9ce80c02d54daa30dab0be484924691e481fd99b6dff1a3ca538834f72
    steps:
      - uses: actions/checkout@v4

      - name: Patch and validate production
        id: finish
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import os,re,json,subprocess,email,time,hashlib,traceback,datetime
          from email import policy

          out={'startedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          expected=os.environ['EXPECTED_SHA']
          token=os.environ.get('CF_TOKEN','')
          account=os.environ.get('CF_ACCOUNT','')
          out['tokenPresent']=bool(token)
          out['accountPresent']=bool(account)

          def curl(args, outfile=None):
              cmd=['curl','-sS']+args
              if outfile: cmd += ['-o',outfile]
              cp=subprocess.run(cmd,capture_output=True,text=True)
              return cp

          try:
              if not token: raise RuntimeError('CLOUDFLARE_API_TOKEN is empty')

              # 1) Downloader must already serve the physically approved 038C APK.
              cp=curl(['-fSL','--max-time','180','https://nox-descargas.pagos-noxplay.workers.dev/fenix?final='+str(time.time())],'/tmp/public.apk')
              if cp.returncode: raise RuntimeError('public APK download failed: '+cp.stderr[-300:])
              public_sha=hashlib.sha256(open('/tmp/public.apk','rb').read()).hexdigest()
              out['publicApkSha256']=public_sha
              out['publicBinaryExact']=(public_sha==expected)
              if public_sha!=expected: raise RuntimeError('Downloader is not serving approved 038C APK')

              # 2) Read live Worker source with bindings/metadata preserved.
              worker='fenix360-router-v2'
              api=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/{worker}'
              cp=subprocess.run(['curl','-sS','-D','/tmp/h','-H',f'Authorization: Bearer {token}',api,'-o','/tmp/body','-w','%{http_code}'],capture_output=True,text=True)
              out['workerExportHttp']=(cp.stdout or '')[-3:]
              if cp.returncode or out['workerExportHttp']!='200':
                  raise RuntimeError('Cloudflare Worker export failed HTTP '+str(out['workerExportHttp'])+' '+cp.stderr[-300:])

              headers=open('/tmp/h',errors='replace').read(); raw=open('/tmp/body','rb').read()
              cts=re.findall(r'(?im)^content-type:\s*(.+?)\s*$',headers)
              ct=cts[-1] if cts else 'application/javascript'
              meta=None; parts={}; entry=None
              if 'multipart/' in ct.lower():
                  msg=email.message_from_bytes((f'Content-Type: {ct}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw,policy=policy.default)
                  for p in msg.iter_parts():
                      name=p.get_param('name',header='content-disposition') or p.get_filename() or ''
                      data=p.get_payload(decode=True) or b''
                      if name=='metadata': meta=json.loads(data.decode())
                      else: parts[name]=data
                  entry=(meta or {}).get('main_module') or (meta or {}).get('body_part')
                  if not entry:
                      js=[n for n in parts if n.endswith(('.js','.mjs'))]
                      if len(js)!=1: raise RuntimeError('cannot identify Worker entrypoint')
                      entry=js[0]
                  src=parts[entry].decode()
              else:
                  entry='worker.js'; src=raw.decode()

              # 3) Narrow idempotent metadata edit. No wrapper is added.
              before=src
              src=re.sub(r'(minimumVersionCode\s*:\s*)90012\b',r'\g<1>90014',src)
              src=re.sub(r'(latestVersionCode\s*:\s*)90012\b',r'\g<1>90014',src)
              src=re.sub(r'(latestVersionName\s*:\s*["\'])9\.0\.4(["\'])',r'\g<1>9.0.6\2',src)
              src=src.replace('44fc680f4e844d3b2188aec4c28b724f37e096639b172de2d12ea7720e1fa624',expected)
              src=src.replace('Actualización obligatoria: instalá XUPER FENIX V9.0.4 para continuar.','Actualización obligatoria: instalá XUPER FENIX V9.0.6 para continuar.')

              target=bool(re.search(r'minimumVersionCode\s*:\s*90014\b',src) and re.search(r'latestVersionCode\s*:\s*90014\b',src) and re.search(r'latestVersionName\s*:\s*["\']9\.0\.6["\']',src) and expected in src)
              out['targetMetadataFound']=target
              if not target: raise RuntimeError('expected app-version metadata anchors were not found')

              if src!=before:
                  if meta is not None:
                      parts[entry]=src.encode(); boundary='----XuperV906Final'; chunks=[]
                      def add(name,data,ctype,filename=None):
                          chunks.append(f'--{boundary}\r\n'.encode())
                          disp=f'Content-Disposition: form-data; name="{name}"'+(f'; filename="{filename}"' if filename else '')
                          chunks.append((disp+'\r\n').encode()); chunks.append(f'Content-Type: {ctype}\r\n\r\n'.encode()); chunks.append(data); chunks.append(b'\r\n')
                      add('metadata',json.dumps(meta,separators=(',',':')).encode(),'application/json')
                      for name,data in parts.items(): add(name,data,'application/javascript+module' if name==entry else 'application/octet-stream',name)
                      chunks.append(f'--{boundary}--\r\n'.encode())
                      upload=b''.join(chunks); upload_ct=f'multipart/form-data; boundary={boundary}'
                  else:
                      upload=src.encode(); upload_ct='application/javascript'
                  open('/tmp/upload','wb').write(upload)
                  cp=subprocess.run(['curl','-sS','-X','PUT','-H',f'Authorization: Bearer {token}','-H',f'Content-Type: {upload_ct}','--data-binary','@/tmp/upload',api+'/content','-o','/tmp/upresp','-w','%{http_code}'],capture_output=True,text=True)
                  out['workerUploadHttp']=(cp.stdout or '')[-3:]
                  if cp.returncode or out['workerUploadHttp'] not in ('200','201'):
                      resp=open('/tmp/upresp',errors='replace').read()[-1000:] if os.path.exists('/tmp/upresp') else ''
                      raise RuntimeError('Cloudflare Worker upload failed HTTP '+str(out['workerUploadHttp'])+' '+resp)
                  out['workerChanged']=True
              else:
                  out['workerChanged']=False

              # 4) Verify live app-version converged.
              app=None
              for i in range(12):
                  cp=curl(['-fSL','--max-time','30','https://fenix360-router-v2.pagos-noxplay.workers.dev/app-version?final='+str(time.time())])
                  if cp.returncode==0:
                      try:
                          j=json.loads(cp.stdout)
                          if j.get('minimumVersionCode')==90014 and j.get('latestVersionCode')==90014 and j.get('latestVersionName')=='9.0.6' and j.get('sha256')==expected:
                              app=j; break
                      except Exception: pass
                  time.sleep(5)
              if app is None: raise RuntimeError('live /app-version did not converge to V9.0.6')
              out['appVersion']=app

              # 5) Critical routes must remain healthy.
              cp=curl(['-fSL','--max-time','30','https://fenix360-router-v2.pagos-noxplay.workers.dev/api/v2/access?device=45dfd4ba316a97a1'])
              if cp.returncode: raise RuntimeError('access route HTTP failure')
              access=json.loads(cp.stdout); out['access']=access
              if not (access.get('ok') and access.get('allowed')): raise RuntimeError('access route not allowed')

              cp=curl(['-fSL','--max-time','30','https://fenix360-router-v2.pagos-noxplay.workers.dev/suscripcion?device=45dfd4ba316a97a1'])
              out['subscriptionRouteHttpOk']=(cp.returncode==0)
              if cp.returncode: raise RuntimeError('subscription route HTTP failure')

              out['status']='XUPER_FENIX_V9.0.6_FINALIZED'
          except Exception as e:
              out['status']='FAILED'
              out['error']=repr(e)
              out['trace']=traceback.format_exc()[-2500:]

          out['checkedAtUtc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          open('/tmp/V906_FINAL_STATUS.json','w').write(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY
          exit 0

      - name: Persist result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/V906_FINAL_STATUS.json || printf '{"status":"FAILED","error":"status file missing"}\n' > /tmp/V906_FINAL_STATUS.json
          B64=$(base64 -w0 /tmp/V906_FINAL_STATUS.json)
          API="repos/${GITHUB_REPOSITORY}/contents/V906_FINAL_STATUS.json"
          OLD=$(gh api "$API?ref=main" --jq '.sha' 2>/dev/null || true)
          if [ -n "$OLD" ]; then
            gh api --method PUT "$API" -f message='prod: resultado final XUPER FENIX V9.0.6' -f content="$B64" -f sha="$OLD" -f branch=main >/dev/null
          else
            gh api --method PUT "$API" -f message='prod: resultado final XUPER FENIX V9.0.6' -f content="$B64" -f branch=main >/dev/null
          fi

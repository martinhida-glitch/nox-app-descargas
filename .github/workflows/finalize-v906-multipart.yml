name: Finalizar V9.0.6 multipart exacto

on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-v906-multipart.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: 25829b675a63b9e1ae90e90ca6a69f77
      EXPECTED_SHA: 038c9d9ce80c02d54daa30dab0be484924691e481fd99b6dff1a3ca538834f72
    steps:
      - uses: actions/checkout@v4
      - name: Transactional multipart patch
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import os,re,json,subprocess,time,hashlib,traceback,datetime
          out={'startedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'tokenPresent':bool(os.environ.get('CF_TOKEN'))}
          token=os.environ.get('CF_TOKEN',''); account=os.environ['CF_ACCOUNT']; expected=os.environ['EXPECTED_SHA']
          uploaded=False; original=None; ct=None; api=None
          def run(cmd): return subprocess.run(cmd,capture_output=True,text=True)
          def upload_body(path, content_type):
              cp=run(['curl','-sS','-X','PUT','-H',f'Authorization: Bearer {token}','-H',f'Content-Type: {content_type}','--data-binary','@'+path,api+'/content','-o','/tmp/upload-response','-w','%{http_code}'])
              return (cp.stdout or '')[-3:], (open('/tmp/upload-response',errors='replace').read()[-1500:] if os.path.exists('/tmp/upload-response') else '')
          try:
            if not token: raise RuntimeError('missing Cloudflare token')
            # Approved public binary must be exact before metadata is touched.
            cp=run(['curl','-fsSL','--max-time','180','https://nox-descargas.pagos-noxplay.workers.dev/fenix?final='+str(time.time()),'-o','/tmp/apk'])
            if cp.returncode: raise RuntimeError('Downloader download failed')
            sha=hashlib.sha256(open('/tmp/apk','rb').read()).hexdigest(); out['publicApkSha256']=sha; out['publicBinaryExact']=(sha==expected)
            if sha!=expected: raise RuntimeError('Downloader SHA mismatch')

            api=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/fenix360-router-v2'
            cp=run(['curl','-sS','-D','/tmp/h','-H',f'Authorization: Bearer {token}',api,'-o','/tmp/original','-w','%{http_code}'])
            out['exportHttp']=(cp.stdout or '')[-3:]
            if out['exportHttp']!='200': raise RuntimeError('Worker export failed HTTP '+str(out['exportHttp']))
            headers=open('/tmp/h',errors='replace').read()
            cts=re.findall(r'(?im)^content-type:\s*(.+?)\s*$',headers); ct=cts[-1] if cts else ''
            out['exportContentType']=ct
            if 'multipart/form-data' not in ct.lower(): raise RuntimeError('Worker export is not multipart/form-data')
            original=open('/tmp/original','rb').read()
            patched=original

            # Replace only existing V9.0.4 app-version anchors, leaving MIME headers/metadata/modules untouched.
            rules=[
              (rb'(minimumVersionCode\s*:\s*)90012\b',rb'\g<1>90014'),
              (rb'(latestVersionCode\s*:\s*)90012\b',rb'\g<1>90014'),
              (rb'(latestVersionName\s*:\s*["\'])9\.0\.4(["\'])',rb'\g<1>9.0.6\2')
            ]
            counts=[]
            for pat,rep in rules:
              patched,n=re.subn(pat,rep,patched); counts.append(n)
            patched,n_hash=patched.replace(b'44fc680f4e844d3b2188aec4c28b724f37e096639b172de2d12ea7720e1fa624',expected.encode()), original.count(b'44fc680f4e844d3b2188aec4c28b724f37e096639b172de2d12ea7720e1fa624')
            patched,n_msg=patched.replace('Actualización obligatoria: instalá XUPER FENIX V9.0.4 para continuar.'.encode(),'Actualización obligatoria: instalá XUPER FENIX V9.0.6 para continuar.'.encode()), original.count('Actualización obligatoria: instalá XUPER FENIX V9.0.4 para continuar.'.encode())
            out['replacementCounts']={'minimumVersionCode':counts[0],'latestVersionCode':counts[1],'latestVersionName':counts[2],'sha256':n_hash,'message':n_msg}
            if not all(x>=1 for x in counts) or n_hash<1: raise RuntimeError('required V9.0.4 anchors missing from multipart')
            if patched==original: raise RuntimeError('multipart patch made no changes')
            open('/tmp/patched','wb').write(patched)

            http,resp=upload_body('/tmp/patched',ct); out['uploadHttp']=http
            if http not in ('200','201'): raise RuntimeError('multipart upload failed HTTP '+http+' '+resp)
            uploaded=True

            # Validate the exact live contract.
            app=None
            for i in range(12):
              cp=run(['curl','-fsSL','--max-time','30','https://fenix360-router-v2.pagos-noxplay.workers.dev/app-version?v='+str(time.time())])
              if cp.returncode==0:
                try:
                  j=json.loads(cp.stdout)
                  if j.get('minimumVersionCode')==90014 and j.get('latestVersionCode')==90014 and j.get('latestVersionName')=='9.0.6' and j.get('sha256')==expected and j.get('mandatory') is True and j.get('downloadUrl')=='https://nox-descargas.pagos-noxplay.workers.dev/fenix':
                    app=j; break
                except: pass
              time.sleep(5)
            if app is None: raise RuntimeError('live /app-version did not converge to V9.0.6')
            out['appVersion']=app

            cp=run(['curl','-fsSL','--max-time','30','https://fenix360-router-v2.pagos-noxplay.workers.dev/api/v2/access?device=45dfd4ba316a97a1'])
            if cp.returncode: raise RuntimeError('access route HTTP failure')
            access=json.loads(cp.stdout); out['access']=access
            if not (access.get('ok') and access.get('allowed')): raise RuntimeError('access route not allowed')

            cp=run(['curl','-fsSL','--max-time','30','https://fenix360-router-v2.pagos-noxplay.workers.dev/suscripcion?device=45dfd4ba316a97a1'])
            out['subscriptionRouteHttpOk']=(cp.returncode==0)
            if cp.returncode: raise RuntimeError('subscription route HTTP failure')
            out['status']='XUPER_FENIX_V9.0.6_FINALIZED'
          except Exception as e:
            out['status']='FAILED'; out['error']=repr(e); out['trace']=traceback.format_exc()[-2500:]
            # Fail-safe rollback only if a deployment actually succeeded and subsequent validation failed.
            if uploaded and original is not None and ct and api:
              try:
                http,resp=upload_body('/tmp/original',ct)
                out['rollbackAttempted']=True; out['rollbackHttp']=http; out['rollbackSucceeded']=http in ('200','201')
              except Exception as rb:
                out['rollbackAttempted']=True; out['rollbackSucceeded']=False; out['rollbackError']=repr(rb)
          out['checkedAtUtc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          open('/tmp/status.json','w').write(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY
          exit 0
      - name: Persist final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/status.json || echo '{"status":"FAILED","error":"missing status"}' > /tmp/status.json
          B64=$(base64 -w0 /tmp/status.json)
          API="repos/${GITHUB_REPOSITORY}/contents/V906_FINAL_STATUS.json"
          OLD=$(gh api "$API?ref=main" --jq '.sha' 2>/dev/null || true)
          if [ -n "$OLD" ]; then gh api --method PUT "$API" -f message='prod: estado definitivo XUPER FENIX V9.0.6' -f content="$B64" -f sha="$OLD" -f branch=main >/dev/null; else gh api --method PUT "$API" -f message='prod: estado definitivo XUPER FENIX V9.0.6' -f content="$B64" -f branch=main >/dev/null; fi

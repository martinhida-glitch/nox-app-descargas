name: Finalizar V9.0.6 Worker module

on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-v906-module.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: 25829b675a63b9e1ae90e90ca6a69f77
      EXPECTED_SHA: 038c9d9ce80c02d54daa30dab0be484924691e481fd99b6dff1a3ca538834f72
    steps:
      - uses: actions/checkout@v4
      - name: Patch module and validate
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import os,re,json,subprocess,time,hashlib,traceback,datetime
          out={'startedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'tokenPresent':bool(os.environ.get('CF_TOKEN'))}
          token=os.environ.get('CF_TOKEN',''); account=os.environ['CF_ACCOUNT']; expected=os.environ['EXPECTED_SHA']
          try:
            if not token: raise RuntimeError('missing Cloudflare token')
            def run(cmd): return subprocess.run(cmd,capture_output=True,text=True)
            cp=run(['curl','-fsSL','--max-time','180','https://nox-descargas.pagos-noxplay.workers.dev/fenix?m='+str(time.time()),'-o','/tmp/apk'])
            if cp.returncode: raise RuntimeError('Downloader download failed')
            sha=hashlib.sha256(open('/tmp/apk','rb').read()).hexdigest(); out['publicApkSha256']=sha
            if sha!=expected: raise RuntimeError('Downloader SHA mismatch')
            api=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/fenix360-router-v2'
            cp=run(['curl','-sS','-D','/tmp/h','-H',f'Authorization: Bearer {token}',api,'-o','/tmp/src','-w','%{http_code}'])
            out['exportHttp']=(cp.stdout or '')[-3:]
            if out['exportHttp']!='200': raise RuntimeError('export failed '+str(out['exportHttp']))
            headers=open('/tmp/h',errors='replace').read(); out['exportContentType']=next((x.split(':',1)[1].strip() for x in headers.splitlines() if x.lower().startswith('content-type:')),None)
            src=open('/tmp/src',errors='strict').read(); before=src
            src=re.sub(r'(minimumVersionCode\s*:\s*)90012\b',r'\g<1>90014',src)
            src=re.sub(r'(latestVersionCode\s*:\s*)90012\b',r'\g<1>90014',src)
            src=re.sub(r'(latestVersionName\s*:\s*["\'])9\.0\.4(["\'])',r'\g<1>9.0.6\2',src)
            src=src.replace('44fc680f4e844d3b2188aec4c28b724f37e096639b172de2d12ea7720e1fa624',expected)
            src=src.replace('Actualización obligatoria: instalá XUPER FENIX V9.0.4 para continuar.','Actualización obligatoria: instalá XUPER FENIX V9.0.6 para continuar.')
            ok=bool(re.search(r'minimumVersionCode\s*:\s*90014\b',src) and re.search(r'latestVersionCode\s*:\s*90014\b',src) and re.search(r'latestVersionName\s*:\s*["\']9\.0\.6["\']',src) and expected in src)
            out['targetMetadataFound']=ok
            if not ok: raise RuntimeError('target metadata not found')
            if src!=before:
              open('/tmp/newsrc','w').write(src)
              cp=run(['curl','-sS','-X','PUT','-H',f'Authorization: Bearer {token}','-H','Content-Type: application/javascript+module','--data-binary','@/tmp/newsrc',api+'/content','-o','/tmp/up','-w','%{http_code}'])
              out['uploadHttp']=(cp.stdout or '')[-3:]
              if out['uploadHttp'] not in ('200','201'):
                resp=open('/tmp/up',errors='replace').read()[-1200:] if os.path.exists('/tmp/up') else ''
                raise RuntimeError('upload failed HTTP '+str(out['uploadHttp'])+' '+resp)
              out['workerChanged']=True
            else: out['workerChanged']=False
            app=None
            for i in range(12):
              cp=run(['curl','-fsSL','--max-time','30','https://fenix360-router-v2.pagos-noxplay.workers.dev/app-version?v='+str(time.time())])
              if cp.returncode==0:
                try:
                  j=json.loads(cp.stdout)
                  if j.get('minimumVersionCode')==90014 and j.get('latestVersionCode')==90014 and j.get('latestVersionName')=='9.0.6' and j.get('sha256')==expected:
                    app=j; break
                except: pass
              time.sleep(5)
            if app is None: raise RuntimeError('app-version did not converge')
            out['appVersion']=app
            cp=run(['curl','-fsSL','--max-time','30','https://fenix360-router-v2.pagos-noxplay.workers.dev/api/v2/access?device=45dfd4ba316a97a1'])
            if cp.returncode: raise RuntimeError('access HTTP failure')
            access=json.loads(cp.stdout); out['access']=access
            if not (access.get('ok') and access.get('allowed')): raise RuntimeError('access not allowed')
            cp=run(['curl','-fsSL','--max-time','30','https://fenix360-router-v2.pagos-noxplay.workers.dev/suscripcion?device=45dfd4ba316a97a1'])
            out['subscriptionRouteHttpOk']=(cp.returncode==0)
            if cp.returncode: raise RuntimeError('subscription HTTP failure')
            out['status']='XUPER_FENIX_V9.0.6_FINALIZED'
          except Exception as e:
            out['status']='FAILED'; out['error']=repr(e); out['trace']=traceback.format_exc()[-2500:]
          out['checkedAtUtc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          open('/tmp/status.json','w').write(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY
          exit 0
      - name: Persist status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/status.json || echo '{"status":"FAILED","error":"missing status"}' > /tmp/status.json
          B64=$(base64 -w0 /tmp/status.json)
          API="repos/${GITHUB_REPOSITORY}/contents/V906_FINAL_STATUS.json"
          OLD=$(gh api "$API?ref=main" --jq '.sha' 2>/dev/null || true)
          if [ -n "$OLD" ]; then gh api --method PUT "$API" -f message='prod: resultado final V9.0.6' -f content="$B64" -f sha="$OLD" -f branch=main >/dev/null; else gh api --method PUT "$API" -f message='prod: resultado final V9.0.6' -f content="$B64" -f branch=main >/dev/null; fi

name: TEMP Promote V9.0.6 038C

on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-v906-promote-038c.yml']

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: 038c9d9ce80c02d54daa30dab0be484924691e481fd99b6dff1a3ca538834f72
      TAG: v9.0.6
      SOURCE_ASSET: XUPER_FENIX_V9.0.6_FUNCIONAL_038C.apk
      STABLE_ASSET: xuper-fenix-v6.apk
      PUBLIC_URL: https://nox-descargas.pagos-noxplay.workers.dev/fenix
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify approved V9.0.6 asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/src
          gh release download "$TAG" --pattern "$SOURCE_ASSET" --dir /tmp/src
          SHA=$(sha256sum "/tmp/src/$SOURCE_ASSET" | awk '{print $1}')
          echo "SOURCE_SHA=$SHA"
          test "$SHA" = "$EXPECTED_SHA"
          cp "/tmp/src/$SOURCE_ASSET" "/tmp/$STABLE_ASSET"

      - name: Replace stable release asset with exact approved binary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete-asset "$TAG" "$STABLE_ASSET" -y || true
          gh release upload "$TAG" "/tmp/$STABLE_ASSET" --clobber
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          gh release download "$TAG" --pattern "$STABLE_ASSET" --dir /tmp/verify
          SHA=$(sha256sum "/tmp/verify/$STABLE_ASSET" | awk '{print $1}')
          echo "STABLE_RELEASE_SHA=$SHA"
          test "$SHA" = "$EXPECTED_SHA"

      - name: Verify Downloader stable route converges to exact 038C
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 12); do
            rm -f /tmp/public.apk
            if curl -fsSL --max-time 180 "$PUBLIC_URL?v906=$RANDOM-$i" -o /tmp/public.apk; then
              SHA=$(sha256sum /tmp/public.apk | awk '{print $1}')
              echo "attempt=$i PUBLIC_SHA=$SHA"
              if [ "$SHA" = "$EXPECTED_SHA" ]; then ok=1; break; fi
            fi
            sleep 5
          done
          test "$ok" = 1

      - name: Persist validation record
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PUBSHA=$(sha256sum /tmp/public.apk | awk '{print $1}')
          APPVER=$(curl -fsSL --max-time 30 'https://fenix360-router-v2.pagos-noxplay.workers.dev/app-version' || echo '{}')
          python3 - <<PY > /tmp/status.json
          import json,datetime
          try: app=json.loads('''$APPVER''')
          except: app={}
          print(json.dumps({
            'status':'V9.0.6_038C_PROMOTED_TO_STABLE_ASSET',
            'checkedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'tag':'v9.0.6',
            'sourceAsset':'XUPER_FENIX_V9.0.6_FUNCIONAL_038C.apk',
            'stableAsset':'xuper-fenix-v6.apk',
            'expectedSha256':'$EXPECTED_SHA',
            'publicSha256':'$PUBSHA',
            'publicBinaryExact':'$PUBSHA'=='$EXPECTED_SHA',
            'publicUrl':'https://nox-descargas.pagos-noxplay.workers.dev/fenix',
            'downloaderCode':'8272460',
            'appVersionAtPromotion':app
          },indent=2,ensure_ascii=False))
          PY
          B64=$(base64 -w0 /tmp/status.json)
          API="repos/${GITHUB_REPOSITORY}/contents/V906_ALIAS_STATUS.json"
          OLD=$(gh api "$API?ref=main" --jq '.sha' 2>/dev/null || true)
          if [ -n "$OLD" ]; then gh api --method PUT "$API" -f message='prod: registrar promoción V9.0.6 038C' -f content="$B64" -f sha="$OLD" -f branch=main >/dev/null; else gh api --method PUT "$API" -f message='prod: registrar promoción V9.0.6 038C' -f content="$B64" -f branch=main >/dev/null; fi

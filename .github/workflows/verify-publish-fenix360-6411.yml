name: Verificar y publicar Fénix 360 V6.4.11

on:
  pull_request:
    branches: [main]
    paths:
      - 'release-finalize-trigger.txt'

permissions:
  contents: write

jobs:
  verify-publish:
    if: github.head_ref == 'agent/publish-fenix360-6411-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: v6.4.11
      ASSET: xuper-fenix-v6.apk
      FINAL_SHA: db101e73a69364c6d87cd96b76a933b8ecd13cae2aac040b2484cc6c72458efa
      CERT_SHA: 37451f1f4cc89db74ce799d86bb0c9773e3d0f6d679c69e6415fb52f6b51ef0d
      DOWNLOAD_WORKER: https://nox-descargas.pagos-noxplay.workers.dev/fenix
      APP_VERSION: https://fenix360-router-v2.pagos-noxplay.workers.dev/app-version
      ACCESS: https://fenix360-router-v2.pagos-noxplay.workers.dev/api/v2/access
      CONFIG: https://fenix360-router-v2.pagos-noxplay.workers.dev/config-v6
    steps:
      - uses: actions/checkout@v4

      - name: Descargar el asset del borrador
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p private report
          gh release view "$TAG" --repo "$REPO" --json databaseId,tagName,name,isDraft,isPrerelease,url,assets > report/release-before.json
          python3 - <<'PY'
          import json
          d=json.load(open('report/release-before.json'))
          assert d['tagName']=='v6.4.11',d
          assert d['name']=='Fénix 360 V6.4.11 — Versión definitiva',d
          assert d['isDraft'] is True,d
          assets=[a for a in d.get('assets',[]) if a.get('name')=='xuper-fenix-v6.apk']
          assert len(assets)==1,('El borrador debe contener exactamente un xuper-fenix-v6.apk',d.get('assets'))
          PY
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir private --clobber
          test -f "private/$ASSET"

      - name: Verificar APK exacta, versión y firma
        shell: bash
        run: |
          set -Eeuo pipefail
          digest="$(sha256sum "private/$ASSET" | awk '{print $1}')"
          echo "$digest  $ASSET" > report/SHA256SUMS.txt
          test "$digest" = "$FINAL_SHA"
          unzip -t "private/$ASSET" > report/zip-test.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "private/$ASSET" > report/aapt-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "private/$ASSET" > report/apksigner.txt
          grep -Fq "package: name='com.nox4k.xuperfenix.v6' versionCode='60411' versionName='6.4.11'" report/aapt-badging.txt
          grep -Fq 'Verified using v1 scheme (JAR signing): true' report/apksigner.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' report/apksigner.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' report/apksigner.txt
          cert="$(grep -m1 'Signer #1 certificate SHA-256 digest:' report/apksigner.txt | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')"
          test "$cert" = "$CERT_SHA"

      - name: Verificar backend definitivo antes de publicar
        shell: bash
        run: |
          set -Eeuo pipefail
          stamp="$(date +%s)"
          curl -fsS --retry 6 --retry-delay 2 --retry-all-errors "${APP_VERSION}?verify=${stamp}" -o report/app-version-before.json
          curl -fsS --retry 6 --retry-delay 2 --retry-all-errors "${ACCESS}?device=PUBLISH6411${stamp}" -o report/access-before.json
          curl -fsS --retry 6 --retry-delay 2 --retry-all-errors "${CONFIG}?verify=${stamp}" -o report/config-before.json
          python3 - <<'PY'
          import json,os
          v=json.load(open('report/app-version-before.json'))
          assert v.get('minimumVersionCode')==60411 and v.get('latestVersionCode')==60411,v
          assert v.get('latestVersionName')=='6.4.11' and v.get('sha256')==os.environ['FINAL_SHA'],v
          a=json.load(open('report/access-before.json'))
          assert a.get('allowed') is True and a.get('trial') is True and a.get('trialHours')==168,a
          assert 6*86400+20*3600 <= int(a.get('remainingSeconds',0)) <= 7*86400,a
          c=json.load(open('report/config-before.json'))
          assert c.get('channelCount')==139,c
          PY

      - name: Publicar Release como vigente
        shell: bash
        run: |
          set -Eeuo pipefail
          release_id="$(jq -r '.databaseId' report/release-before.json)"
          payload='{"draft":false,"prerelease":false,"make_latest":"true","name":"Fénix 360 V6.4.11 — Versión definitiva"}'
          gh api --method PATCH "repos/${REPO}/releases/${release_id}" --input - <<<"$payload" > report/publish-response.json
          gh release view "$TAG" --repo "$REPO" --json tagName,name,isDraft,isPrerelease,url,assets > report/release-after.json
          python3 - <<'PY'
          import json
          d=json.load(open('report/release-after.json'))
          assert d['isDraft'] is False and d['isPrerelease'] is False,d
          assets=[a for a in d.get('assets',[]) if a.get('name')=='xuper-fenix-v6.apk']
          assert len(assets)==1,assets
          PY

      - name: Verificar GitHub latest y Downloader 8272460
        shell: bash
        run: |
          set -Eeuo pipefail
          sleep 20
          latest="https://github.com/${REPO}/releases/latest/download/${ASSET}"
          curl -fsSL --retry 8 --retry-delay 3 --retry-all-errors "$latest" -o private/latest.apk
          test "$(sha256sum private/latest.apk | awk '{print $1}')" = "$FINAL_SHA"
          curl -fsSL --retry 8 --retry-delay 3 --retry-all-errors "${DOWNLOAD_WORKER}?verify=$(date +%s)" -o private/downloader.apk
          test "$(sha256sum private/downloader.apk | awk '{print $1}')" = "$FINAL_SHA"
          cmp private/latest.apk private/downloader.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging private/downloader.apk > report/downloader-badging.txt
          grep -Fq "versionCode='60411' versionName='6.4.11'" report/downloader-badging.txt
          curl -fsSIL --max-redirs 10 "${DOWNLOAD_WORKER}?verify=$(date +%s)" > report/downloader-redirect-chain.txt
          echo 'VERIFIED: V6.4.11 published; GitHub latest and Downloader 8272460 deliver exact definitive APK.' > report/result.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fenix360-6411-publication-evidence
          path: report/
          retention-days: 7

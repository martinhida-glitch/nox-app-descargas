name: U8K hotfix publication bridge temp

on:
  push:
    branches: [u8k-hotfix-bridge-temp]
    paths: ['.github/workflows/u8k-hotfix-bridge-temp.yml']

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 104dad193ea982211bd45fe36d8c717eb0edf85c7deecc1f6cd082ac755a0650
      EXPECTED_SIZE: '20519464'
      SOURCE_URL_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: u8k-hotfix-bridge-temp
      - name: Recover and verify exact APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p u8k-bridge
          python - <<'PY'
          import os,base64,hashlib,urllib.request
          from pathlib import Path
          url=base64.b64decode(os.environ['SOURCE_URL_B64']).decode()
          req=urllib.request.Request(url,headers={'User-Agent':'Ultra8K-Publication-Bridge'})
          with urllib.request.urlopen(req,timeout=120) as r:
              data=r.read()
          assert len(data)==int(os.environ['EXPECTED_SIZE']), (len(data), os.environ['EXPECTED_SIZE'])
          assert hashlib.sha256(data).hexdigest()==os.environ['EXPECTED_SHA']
          Path('u8k-bridge/Ultra8kLatino-V1.0.apk').write_bytes(data)
          print('Exact Ultra8K V1.0 hotfix verified and staged')
          PY
      - name: Commit exact APK to temporary bridge branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add u8k-bridge/Ultra8kLatino-V1.0.apk
          git commit -m 'temp: stage exact Ultra8K V1.0 hotfix bridge'
          git push origin HEAD:u8k-hotfix-bridge-temp

name: Stage Ultra8K Latino V1.0.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage-ultra8k-v101.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-1750-820e-af8f-18b16c1c7497/raw?se=2026-10-06T22%3A36%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=790fd2ae-7f70-502f-a533-bebd50338ed7&skoid=9fcafdab-1a9a-48a1-833e-6f0dce81fc66&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A08%3A21Z&ske=2026-10-07T01%3A08%3A21Z&sks=b&skv=2026-02-06&sig=F2m13WtR8yQapIYaM0TmQT/vnHbegXHnE25rJmO2QFE%3D' -o /tmp/u8k.zip
          mkdir -p /tmp/u8k
          unzip -q /tmp/u8k.zip -d /tmp/u8k
          test -s /tmp/u8k/Ultra8kLatino-V1.0.1.apk
          echo '5a088f2d701b26dac954cfe36ca31f4b4f528696ec36709cdd4bc3eb148d3c37  /tmp/u8k/Ultra8kLatino-V1.0.1.apk' | sha256sum -c -
      - name: Stage Ultra8K APK without touching Xuper files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ultra8k
          cp /tmp/u8k/Ultra8kLatino-V1.0.1.apk ultra8k/Ultra8kLatino-V1.0.1.apk
          cp /tmp/u8k/Ultra8kLatino-V1.0.1.apk ultra8k/latest.apk
          printf '%s\n' '5a088f2d701b26dac954cfe36ca31f4b4f528696ec36709cdd4bc3eb148d3c37  Ultra8kLatino-V1.0.1.apk' > ultra8k/SHA256SUMS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ultra8k
          git commit -m 'stage: Ultra8K Latino V1.0.1 (271)'
          git push

name: Finalizar V9.0.6 Cloudflare module

on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-v906-cloudflare-module.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: 25829b675a63b9e1ae90e90ca6a69f77
      EXPECTED_SHA: 038c9d9ce80c02d54daa30dab0be484924691e481fd99b6dff1a3ca538834f72
    steps:
      - uses: actions/checkout@v4
      - name: Deploy exact module metadata and validate
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import os,re,json,subprocess,time,hashlib,traceback,datetime,email
          from email import policy
          out={'startedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'tokenPresent':bool(os.environ.get('CF_TOKEN'))}
          token=os.environ.get('CF_TOKEN',''); account=os.environ['CF_ACCOUNT']; expected=os.environ['EXPECTED_SHA']
          api=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/fenix360-router-v2'
          original_src=None; uploaded=False
          def run(cmd): return subprocess.run(cmd,capture_output=True,text=True)
          def build_upload(src_bytes,path):
            boundary='----XuperV906ModuleBoundary'
            meta=json.dumps({'main_module':'index.js'},separators=(',',':')).encode()
            body=(
              f'--{boundary}\r\nContent-Disposition: form-data; name="metadata"\r\nContent-Type: application/json\r\n\r\n'.encode()+meta+b'\r\n'+
              f'--{boundary}\r\nContent-Disposition: form-data; name="index.js"; filename="index.js"\r\nContent-Type: application/javascript+module\r\n\r\n'.encode()+src_bytes+b'\r\n'+
              f'--{boundary}--\r\n'.encode()
            )
            open(path,'wb').write(body)
            return f'multipart/form-data; boundary={boundary}'
          def upload(src_bytes,path):
            ctype=build_upload(src_bytes,path)
            cp=run(['curl','-sS','-X','PUT','-H',f'Authorization: Bearer {token}','-H',f'Content-Type: {ctype}','--data-binary','@'+path,api+'/content','-o','/tmp/upresp','-w','%{http_code}'])
            resp=open('/tmp/upresp',errors='replace').read()[-1500:] if os.path.exists('/tmp/upresp') else ''
            return (cp.stdout or '')[-3:],resp
          try:
            if not token: raise RuntimeError('missing Cloudflare token')
            # Stable Downloader must remain exact 038C.
            cp=run(['curl','-fsSL','--max-time','180','https://nox-descargas.pagos-noxplay.workers.dev/fenix?final='+str(time.time()),'-o','/tmp/apk'])
            if cp.returncode: raise RuntimeError('Downloader download failed')
            sha=hashlib.sha256(open('/tmp/apk','rb').read()).hexdigest(); out['publicApkSha256']=sha; out['publicBinaryExact']=(sha==expected)
            if sha!=expected: raise RuntimeError('Downloader SHA mismatch')

            # Export the current single-module Worker.
            cp=run(['curl','-sS','-D','/tmp/h','-H',f'Authorization: Bearer {token}',api,'-o','/tmp/export','-w','%{http_code}'])
            out['exportHttp']=(cp.stdout or '')[-3:]
            if out['exportHttp']!='200': raise RuntimeError('Worker export failed')
            headers=open('/tmp/h',errors='replace').read(); cts=re.findall(r'(?im)^content-type:\s*(.+?)\s*$',headers); ct=cts[-1] if cts else ''
            msg=email.message_from_bytes((f'Content-Type: {ct}\r\nMIME-Version: 1.0\r\n\r\n').encode()+open('/tmp/export','rb').read(),policy=policy.default)
            found=[]
            for p in msg.iter_parts():
              name=p.get_param('name',header='content-disposition') or p.get_filename() or ''
              data=p.get_payload(decode=True) or b''
              found.append((name,data))
            mods=[data for name,data in found if name=='index.js']
            if len(mods)!=1: raise RuntimeError('expected exactly one index.js module')
            original_src=mods[0]
            src=original_src

            # Narrow V9.0.4 -> V9.0.6 metadata patch in module source only.
            src,n1=re.subn(rb'(minimumVersionCode\s*:\s*)90012\b',rb'\g<1>90014',src)
            src,n2=re.subn(rb'(latestVersionCode\s*:\s*)90012\b',rb'\g<1>90014',src)
            src,n3=re.subn(rb'(latestVersionName\s*:\s*["\'])9\.0\.4(["\'])',rb'\g<1>9.0.6\2',src)
            oldhash=b'44fc680f4e844d3b2188aec4c28b724f37e096639b172de2d12ea7720e1fa624'
            nh=src.count(oldhash); src=src.replace(oldhash,expected.encode())
            oldmsg='Actualización obligatoria: instalá XUPER FENIX V9.0.4 para continuar.'.encode(); nm=src.count(oldmsg); src=src.replace(oldmsg,'Actualización obligatoria: instalá XUPER FENIX V9.0.6 para continuar.'.encode())
            out['replacementCounts']={'minimumVersionCode':n1,'latestVersionCode':n2,'latestVersionName':n3,'sha256':nh,'message':nm}
            if min(n1,n2,n3,nh)<1: raise RuntimeError('required V9.0.4 anchors missing')

            http,resp=upload(src,'/tmp/patched-upload'); out['uploadHttp']=http
            if http not in ('200','201'): raise RuntimeError('module upload failed HTTP '+http+' '+resp)
            uploaded=True

            # Verify version endpoint.
            app=None
            for i in range(12):
              cp=run(['curl','-fsSL','--max-time','30','https://fenix360-router-v2.pagos-noxplay.workers.dev/app-version?v='+str(time.time())])
              if cp.returncode==0:
                try:
                  j=json.loads(cp.stdout)
                  if j.get('minimumVersionCode')==90014 and j.get('latestVersionCode')==90014 and j.get('latestVersionName')=='9.0.6' and j.get('sha256')==expected and j.get('mandatory') is True and j.get('downloadUrl')=='https://nox-descargas.pagos-noxplay.workers.dev/fenix':
                    app=j; break
                except: pass
              time.sleep(5)
            if app is None: raise RuntimeError('live /app-version did not converge')
            out['appVersion']=app

            # Verify access and subscription remained healthy.
            cp=run(['curl','-fsSL','--max-time','30','https://fenix360-router-v2.pagos-noxplay.workers.dev/api/v2/access?device=45dfd4ba316a97a1'])
            if cp.returncode: raise RuntimeError('access route HTTP failure')
            access=json.loads(cp.stdout); out['access']=access
            if not (access.get('ok') and access.get('allowed')): raise RuntimeError('access route not allowed')
            cp=run(['curl','-fsSL','--max-time','30','https://fenix360-router-v2.pagos-noxplay.workers.dev/suscripcion?device=45dfd4ba316a97a1'])
            out['subscriptionRouteHttpOk']=(cp.returncode==0)
            if cp.returncode: raise RuntimeError('subscription route HTTP failure')
            out['status']='XUPER_FENIX_V9.0.6_FINALIZED'
          except Exception as e:
            out['status']='FAILED'; out['error']=repr(e); out['trace']=traceback.format_exc()[-2500:]
            if uploaded and original_src is not None:
              try:
                http,resp=upload(original_src,'/tmp/rollback-upload'); out['rollbackAttempted']=True; out['rollbackHttp']=http; out['rollbackSucceeded']=http in ('200','201')
              except Exception as rb:
                out['rollbackAttempted']=True; out['rollbackSucceeded']=False; out['rollbackError']=repr(rb)
          out['checkedAtUtc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          open('/tmp/status.json','w').write(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY
          exit 0
      - name: Persist status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/status.json || echo '{"status":"FAILED","error":"missing status"}' > /tmp/status.json
          B64=$(base64 -w0 /tmp/status.json)
          API="repos/${GITHUB_REPOSITORY}/contents/V906_FINAL_STATUS.json"
          OLD=$(gh api "$API?ref=main" --jq '.sha' 2>/dev/null || true)
          if [ -n "$OLD" ]; then gh api --method PUT "$API" -f message='prod: XUPER FENIX V9.0.6 finalizada' -f content="$B64" -f sha="$OLD" -f branch=main >/dev/null; else gh api --method PUT "$API" -f message='prod: XUPER FENIX V9.0.6 finalizada' -f content="$B64" -f branch=main >/dev/null; fi
